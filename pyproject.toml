[build-system]
requires = ["setuptools>=84.0", "setuptools-scm>=10.2", "wheel>=0.48"]
build-backend = "setuptools.build_meta"

[project]
name = "defi_amm"
version = "0.1.0"
dynamic = ["readme"]
authors = [{ name = "©2024 Joaquin Bejar", email = "jb@taunais.com" }]
description = "Common Python Library"
requires-python = ">=3.12"
keywords = ["common", "python", "library"]
classifiers = ["Programming Language :: Python :: 3.12"]
dependencies = [
  "python-dotenv>=1.2",
  "numpy>=2.5",
  "matplotlib>=3.11",
  "flask>=3.1",
  "pyinstaller>=6.22",
]

[tool.setuptools.dynamic]
readme = { file = ["README.md"], content-type = "text/markdown" }


[project.optional-dependencies]
tests = ["time-machine>=3.5", "coverage>=7.16"]
extended = ["time-machine>=3.5"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["defi_amm*"]
